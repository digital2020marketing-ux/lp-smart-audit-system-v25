<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-capa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow-capa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-capa)"/>
  <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640" stroke="#065f46" stroke-width="0.5" stroke-opacity="0.4"/>
  <path d="M128 0 V400 M256 0 V400 M384 0 V400 M512 0 V400" stroke="#065f46" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Window Container -->
  <g transform="translate(24, 20)" filter="url(#shadow-capa)">
    <!-- Window Frame -->
    <rect width="592" height="360" rx="12" fill="#09141f" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Title Bar -->
    <rect width="592" height="38" rx="12" fill="#1e293b"/>
    <rect y="26" width="592" height="12" fill="#1e293b"/>
    <line x1="0" y1="38" x2="592" y2="38" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    
    <text x="74" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">AI CAPA &amp; 5-Why Root Cause Engine</text>
    
    <!-- Badge Status -->
    <rect x="465" y="9" width="112" height="20" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="521" y="23" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Tindak Lanjut CAPA</text>

    <!-- Content Area -->
    <g transform="translate(18, 50)">
      <!-- 5-Why Section -->
      <rect width="556" height="110" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="10" width="180" height="20" rx="4" fill="#047857" fill-opacity="0.3"/>
      <text x="104" y="24" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Analisis Akar Masalah (5-Why):</text>
      
      <!-- Why Steps -->
      <g transform="translate(14, 38)">
        <text x="0" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Why 1: Mengapa timbangan tidak terkalibrasi? → <tspan fill="#f1f5f9" font-weight="600">Jadwal berkala terlewatkan.</tspan></text>
        <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Why 2: Mengapa terlewatkan? → <tspan fill="#f1f5f9" font-weight="600">Tracking dilakukan via spreadsheet manual tanpa alert.</tspan></text>
        <text x="0" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Root Cause: <tspan fill="#a7f3d0" font-weight="600">Belum ada sistem pengingat otomatis H-30 sebelum masa kalibrasi habis.</tspan></text>
      </g>

      <!-- Action Plan Split -->
      <g transform="translate(0, 120)">
        <!-- Box 1: Koreksi Langsung -->
        <rect width="270" height="110" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
        <rect x="12" y="10" width="140" height="20" rx="4" fill="#1d4ed8" fill-opacity="0.3"/>
        <text x="82" y="24" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. Tindakan Koreksi (Segera)</text>
        <text x="14" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Beri label karantina pada TMB-04</text>
        <text x="14" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Kirim ke lab kalibrasi KAN terakreditasi</text>
        <text x="14" y="94" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="700">PIC: Spv Gudang | Deadline: H+3</text>

        <!-- Box 2: Tindakan Pencegahan -->
        <g transform="translate(286, 0)">
          <rect width="270" height="110" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-width="1"/>
          <rect x="12" y="10" width="160" height="20" rx="4" fill="#047857" fill-opacity="0.3"/>
          <text x="92" y="24" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. Tindakan Pencegahan (CAPA)</text>
          <text x="14" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Setup notifikasi otomatis kalibrasi H-30</text>
          <text x="14" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Tambahkan audit bulanan internal aset ukur</text>
          <text x="14" y="94" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">PIC: QA Manager | Deadline: H+14</text>
        </g>
      </g>

      <!-- Footer Action -->
      <g transform="translate(0, 240)">
        <rect width="556" height="46" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <text x="16" y="28" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Template CAPA Terverifikasi Standard Audit Mutu Internal</text>
        <rect x="420" y="9" width="124" height="28" rx="6" fill="url(#green-glow)"/>
        <text x="482" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Export CAPA Form</text>
      </g>
    </g>
  </g>
</svg>
