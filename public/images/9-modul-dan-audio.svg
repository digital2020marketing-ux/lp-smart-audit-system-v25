<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-modul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-modul)"/>
  <circle cx="560" cy="80" r="180" fill="#3b82f6" fill-opacity="0.1" />
  <circle cx="80" cy="320" r="140" fill="#6366f1" fill-opacity="0.1" />

  <!-- Main Graphic Binder / Book Layout -->
  <g transform="translate(30, 24)">
    <!-- Header Banner -->
    <rect width="580" height="54" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="14" y="12" width="30" height="30" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
    <path d="M22 20 H36 M22 26 H32 M22 32 H34" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="27" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">9 MODUL PANDUAN PRAKTIS AUDITOR INTERNAL</text>
    <text x="56" y="44" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Sesuai Standar Pedoman ISO 19011:2026 &amp; Praktik Nyata Lapangan</text>
    
    <rect x="470" y="14" width="96" height="26" rx="6" fill="url(#gold-grad)"/>
    <text x="518" y="31" text-anchor="middle" fill="#000" font-family="system-ui, sans-serif" font-size="10" font-weight="900">9 MODUL EBOOK</text>

    <!-- 3x3 Grid of Module Chips -->
    <g transform="translate(0, 68)">
      <!-- Modul 1 -->
      <g transform="translate(0, 0)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">01</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fondasi &amp; Prinsip</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Prinsip audit integritas &amp;</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">pendekatan berbasis risiko</text>
      </g>

      <!-- Modul 2 -->
      <g transform="translate(196, 0)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">02</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Program Audit</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Penyusunan jadwal tahunan &amp;</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">alokasi auditor independen</text>
      </g>

      <!-- Modul 3 -->
      <g transform="translate(392, 0)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">03</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Audit Plan &amp; Lingkup</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Menetapkan kriteria spesifik,</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">sampling, &amp; dokumen acuan</text>
      </g>

      <!-- Modul 4 -->
      <g transform="translate(0, 94)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">04</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Checklist &amp; Sampling</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Menyusun pertanyaan 5W+1H</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&amp; teknik uji petik data</text>
      </g>

      <!-- Modul 5 -->
      <g transform="translate(196, 94)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">05</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Opening &amp; Lapangan</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Opening meeting formal,</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">observasi, &amp; wawancara</text>
      </g>

      <!-- Modul 6 -->
      <g transform="translate(392, 94)">
        <rect width="186" height="84" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="22" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="19" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">06</text>
        <text x="36" y="23" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Formulasi PLOR</text>
        <text x="10" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Problem, Location, Objective,</text>
        <text x="10" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Requirement tanpa debat</text>
      </g>

      <!-- Modul 7, 8, 9 Footer Row -->
      <g transform="translate(0, 188)">
        <rect width="186" height="80" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="10" y="22" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">07. Closing Meeting</text>
        <text x="10" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Presentasi temuan ke auditee</text>
      </g>

      <g transform="translate(196, 188)">
        <rect width="186" height="80" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="10" y="22" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="800">08. Laporan &amp; Ringkasan</text>
        <text x="10" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Format laporan eksekutif</text>
      </g>

      <g transform="translate(392, 188)">
        <rect width="186" height="80" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="10" y="22" fill="#34d399" font-family="monospace" font-size="10" font-weight="800">09. Verifikasi CAPA</text>
        <text x="10" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Validasi bukti perbaikan</text>
      </g>
    </g>
  </g>
</svg>
