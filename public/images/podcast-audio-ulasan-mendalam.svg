        <rect x="424" y="12" width="94" height="30" rx="6" fill="url(#purple-btn)"/>
        <text x="471" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Dengarkan HD</text>
