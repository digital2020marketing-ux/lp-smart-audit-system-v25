          <rect x="352" y="18" width="4" height="4" rx="2" fill="#334155"/>
          <rect x="360" y="18" width="4" height="4" rx="2" fill="#334155"/>
          
          <text x="0" y="38" fill="#a855f7" font-family="monospace" font-size="10" font-weight="700">14:28</text>
          <text x="340" y="38" fill="#64748b" font-family="monospace" font-size="10" font-weight="700">28:45</text>
