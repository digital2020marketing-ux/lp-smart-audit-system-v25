<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purple-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-pod)"/>
  
  <!-- Equalizer Ambient Circles -->
  <circle cx="520" cy="120" r="140" fill="#a855f7" fill-opacity="0.12"/>
  <circle cx="120" cy="280" r="120" fill="#6366f1" fill-opacity="0.12"/>

  <!-- Podcast Player Window -->
  <g transform="translate(30, 24)">
    <rect width="580" height="352" rx="14" fill="#0b0f19" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Top Player Header -->
    <rect width="580" height="40" rx="14" fill="#1e1b4b"/>
    <rect y="28" width="580" height="12" fill="#1e1b4b"/>
    <line x1="0" y1="40" x2="580" y2="40" stroke="#3730a3" stroke-width="1"/>
    
    <circle cx="22" cy="20" r="5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5" fill="#10b981"/>
    
    <text x="76" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Audio Podcast Ulasan Mendalam - SMART Audit</text>
    
    <rect x="470" y="10" width="94" height="20" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
    <text x="517" y="24" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STUDI KASUS</text>

    <!-- Main Player Card -->
    <g transform="translate(24, 60)">
      <!-- Left: Album Art Box -->
      <rect width="140" height="140" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="42" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
      <polygon points="64,56 82,70 64,84" fill="#f3e8ff"/>
      <text x="70" y="126" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SMART PODCAST</text>

      <!-- Right: Track Details & Waveform -->
      <g transform="translate(160, 10)">
        <text x="0" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">EPISODE 04 • PRAKTIK LAPANGAN</text>
        <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Psikologi Menghadapi Auditee Defensif</text>
        <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Teknik komunikasi persuasif dan formulasi temuan tanpa memicu konflik.</text>

