<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-ai5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-ai5)"/>

  <!-- AI Suite Interface -->
  <g transform="translate(24, 20)">
    <rect width="592" height="360" rx="12" fill="#081018" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Title Bar -->
    <rect width="592" height="38" rx="12" fill="#155e75"/>
    <rect y="26" width="592" height="12" fill="#155e75"/>
    <line x1="0" y1="38" x2="592" y2="38" stroke="#0e7490" stroke-width="1"/>
    
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    
    <text x="74" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">5 AI TOOLS &amp; SIMULASI AUDIT MUTU INTERNAL</text>
    
    <rect x="470" y="9" width="106" height="20" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <text x="523" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SMART AI SUITE</text>

    <!-- 5 Tool Nodes Grid -->
    <g transform="translate(16, 52)">
      <!-- Tool 1: Checklist AI -->
      <g transform="translate(0, 0)">
        <rect width="270" height="74" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
        <circle cx="28" cy="37" r="16" fill="#0284c7" fill-opacity="0.2"/>
        <text x="28" y="42" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="900">✓</text>
        <text x="54" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. AI Checklist Generator</text>
        <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Pertanyaan 5W+1H &amp; klausul spesifik</text>
        <text x="54" y="58" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">Otomatisasi 12+ Dept</text>
      </g>

      <!-- Tool 2: PLOR Generator -->
      <g transform="translate(290, 0)">
        <rect width="270" height="74" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
        <circle cx="28" cy="37" r="16" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="28" y="42" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="900">PL</text>
        <text x="54" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. AI PLOR Temuan Engine</text>
        <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Formulasi temuan tak terbantahkan</text>
        <text x="54" y="58" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700">Standard ISO 19011</text>
      </g>

      <!-- Tool 3: CAPA Assistant -->
      <g transform="translate(0, 84)">
        <rect width="270" height="74" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="28" cy="37" r="16" fill="#10b981" fill-opacity="0.2"/>
        <text x="28" y="42" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="900">5W</text>
        <text x="54" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. AI CAPA &amp; 5-Why</text>
        <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Akar masalah &amp; tindakan pencegahan</text>
        <text x="54" y="58" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">Action Plan Terstruktur</text>
      </g>

      <!-- Tool 4: Simulasi Lapangan -->
      <g transform="translate(290, 84)">
        <rect width="270" height="74" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
        <circle cx="28" cy="37" r="16" fill="#a855f7" fill-opacity="0.2"/>
        <text x="28" y="42" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="900">SM</text>
        <text x="54" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. Simulator Wawancara</text>
        <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Roleplay auditee sulit &amp; trik negosiasi</text>
        <text x="54" y="58" fill="#c084fc" font-family="monospace" font-size="9" font-weight="700">Skenario Realistis</text>
      </g>

      <!-- Tool 5: Co-Pilot Assistant Center -->
      <g transform="translate(0, 168)">
        <rect width="560" height="66" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="32" cy="33" r="18" fill="#0284c7" fill-opacity="0.3"/>
        <text x="32" y="39" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="900">★</text>
        <text x="62" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">5. Co-Pilot Asisten ISO 19011:2026</text>
        <text x="62" y="44" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">Tanya jawab instan klausul, interpretasi regulasi, dan panduan audit 24/7</text>
        <rect x="444" y="18" width="102" height="28" rx="6" fill="url(#cyan-glow)"/>
        <text x="495" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Coba Gratis</text>
      </g>
    </g>
  </g>
</svg>
