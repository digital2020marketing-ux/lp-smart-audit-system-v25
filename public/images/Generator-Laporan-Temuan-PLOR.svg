<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-plor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow-plor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-plor)"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M128 0 V400 M256 0 V400 M384 0 V400 M512 0 V400" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Window Container -->
  <g transform="translate(24, 20)" filter="url(#shadow-plor)">
    <!-- Window Frame -->
    <rect width="592" height="360" rx="12" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Title Bar -->
    <rect width="592" height="38" rx="12" fill="#1e293b"/>
    <rect y="26" width="592" height="12" fill="#1e293b"/>
    <line x1="0" y1="38" x2="592" y2="38" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    
    <text x="74" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">AI PLOR Finding Generator</text>
    
    <!-- Badge ISO 19011 -->
    <rect x="475" y="9" width="102" height="20" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="526" y="23" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">ISO 19011:2026</text>

    <!-- PLOR Cards Box -->
    <g transform="translate(18, 52)">
      <!-- Item P: Problem -->
      <rect width="556" height="58" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2"/>
      <rect width="6" height="58" rx="3" fill="#ef4444"/>
      <rect x="14" y="10" width="80" height="18" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="54" y="23" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">[P] PROBLEM</text>
      <text x="104" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ketidaksesuaian yang ditemukan di lapangan:</text>
      <text x="16" y="44" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Alat timbangan operasional belum dilakukan kalibrasi ulang berkala.</text>

      <!-- Item L: Location -->
      <g transform="translate(0, 66)">
        <rect width="556" height="52" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2"/>
        <rect width="6" height="52" rx="3" fill="#3b82f6"/>
        <rect x="14" y="8" width="85" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="56" y="21" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700">[L] LOCATION</text>
        <text x="108" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Area / Departemen Terkait:</text>
        <text x="16" y="40" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Gudang Bahan Baku Utama (Line B Area Timbangan TMB-04)</text>
      </g>

      <!-- Item O: Objective -->
      <g transform="translate(0, 126)">
        <rect width="556" height="52" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2"/>
        <rect width="6" height="52" rx="3" fill="#f59e0b"/>
        <rect x="14" y="8" width="95" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="61" y="21" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">[O] OBJECTIVE</text>
        <text x="118" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Bukti Nyata / Objective Evidence:</text>
        <text x="16" y="40" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Stiker kalibrasi TMB-04 tercatat kedaluwarsa sejak 15 November 2025.</text>
      </g>

      <!-- Item R: Requirement -->
      <g transform="translate(0, 186)">
        <rect width="556" height="52" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2"/>
        <rect width="6" height="52" rx="3" fill="#10b981"/>
        <rect x="14" y="8" width="115" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="71" y="21" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">[R] REQUIREMENT</text>
        <text x="138" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Klausul Standar yang Dilanggar:</text>
        <text x="16" y="40" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ISO 9001:2015 Klausul 7.1.5.2 Mampu Telusur Pengukuran</text>
      </g>

      <!-- Footer Action -->
      <g transform="translate(0, 246)">
        <rect width="556" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Rumusan Temuan Objektif &amp; Siap Masuk Laporan AMI</text>
        <rect x="420" y="7" width="124" height="28" rx="6" fill="url(#amber-glow)"/>
        <text x="482" y="25" text-anchor="middle" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Copy Format PLOR</text>
      </g>
    </g>
  </g>
</svg>
