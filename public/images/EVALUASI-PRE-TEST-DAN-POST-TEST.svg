<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-eval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="emerald-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bg-eval)"/>

  <!-- Evaluation Card Container -->
  <g transform="translate(24, 20)">
    <rect width="592" height="360" rx="12" fill="#091419" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Title Bar -->
    <rect width="592" height="38" rx="12" fill="#064e3b"/>
    <rect y="26" width="592" height="12" fill="#064e3b"/>
    <line x1="0" y1="38" x2="592" y2="38" stroke="#047857" stroke-width="1"/>
    
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    
    <text x="74" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EVALUASI PRE-TEST &amp; POST-TEST AUDITOR MUTU INTERNAL</text>
    
    <rect x="470" y="9" width="106" height="20" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <text x="523" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">UJI KOMPETENSI</text>

    <!-- Content Sections -->
    <g transform="translate(18, 52)">
      <!-- Left: Score Progress Box -->
      <rect width="260" height="174" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PERBANDINGAN SKOR AUDITOR</text>
      
      <!-- Pre Test Bar -->
      <g transform="translate(14, 42)">
        <text x="0" y="10" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Pre-Test (Sebelum Modul):</text>
        <rect y="16" width="232" height="14" rx="4" fill="#0f172a"/>
        <rect y="16" width="104" height="14" rx="4" fill="#f59e0b"/>
        <text x="114" y="27" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">45%</text>
      </g>

      <!-- Post Test Bar -->
      <g transform="translate(14, 94)">
        <text x="0" y="10" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Post-Test (Setelah SMART Audit):</text>
        <rect y="16" width="232" height="14" rx="4" fill="#0f172a"/>
        <rect y="16" width="220" height="14" rx="4" fill="#10b981"/>
        <text x="180" y="27" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800">95% LULUS</text>
      </g>
      
      <text x="14" y="158" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">▲ Peningkatan Kompetensi +50%</text>

      <!-- Right: Features List Box -->
      <g transform="translate(276, 0)">
        <rect width="280" height="174" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PAKET SOAL &amp; EVALUASI LENGKAP</text>
        
        <g transform="translate(14, 40)">
          <text x="0" y="12" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• 40+ Bank Soal Pilihan Ganda &amp; Kasus</text>
          <text x="0" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Kunci Jawaban &amp; Pembahasan Klausul</text>
          <text x="0" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Lembar Penilaian Mandiri Auditor</text>
          <text x="0" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Format Sertifikat Internal Siap Cetak</text>
          <text x="0" y="104" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">Standar Pengujian ISO 19011:2026</text>
        </g>
      </g>

      <!-- Bottom Card -->
      <g transform="translate(0, 186)">
        <rect width="556" height="50" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
        <text x="16" y="30" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Validasi Kesiapan Tim Sebelum Menghadapi Audit Badan Sertifikasi</text>
        <rect x="430" y="11" width="112" height="28" rx="6" fill="url(#emerald-badge)"/>
        <text x="486" y="29" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Mulai Evaluasi</text>
      </g>
    </g>
  </g>
</svg>
